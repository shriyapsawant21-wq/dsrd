apiVersion: v1
kind: Namespace
metadata:
  name: dsrd-kubernetes-race
  labels:
    dsrd.infrastructure: namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dsrd-kubernetes-race
  labels:
    dsrd.workload: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "sleep 300"]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: dsrd-kubernetes-race
  labels:
    dsrd.workload: database
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: busybox:1.36
          command: ["sh", "-c", "sleep 300"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: dsrd-kubernetes-race
  labels:
    dsrd.workload: migrate
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c", "true"]
